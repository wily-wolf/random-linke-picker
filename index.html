<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estrai Riga Casuale</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 600px;
      text-align: center;
    }

    h1 {
      margin-bottom: 1rem;
      color: #333;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 1rem;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      resize: none;
      box-sizing: border-box;
    }

    button {
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      background-color: #0077cc;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #005fa3;
    }

    #output {
      margin-top: 1.5rem;
      font-size: 1.2rem;
      word-wrap: break-word;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Estrai una riga casuale</h1>
    <textarea id="textInput" placeholder="Incolla qui il tuo testo multilinea..."></textarea>
    <button onclick="pickRandomLine()">Estrai Riga</button>
    <div id="output"></div>
  </div>

  <script>
    function pickRandomLine() {
      const text = document.getElementById("textInput").value;
      const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
      if (lines.length === 0) {
        document.getElementById("output").innerHTML = "Nessuna riga valida trovata.";
        return;
      }

      const randomLine = lines[Math.floor(Math.random() * lines.length)].trim();

      if (randomLine.startsWith("http://") || randomLine.startsWith("https://")) {
        document.getElementById("output").innerHTML = `<a href="${randomLine}" target="_blank">${randomLine}</a>`;
      } else {
        document.getElementById("output").textContent = randomLine;
      }
    }
  </script>
</body>
</html>
